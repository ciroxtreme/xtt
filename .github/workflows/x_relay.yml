name: X (Twitter) Live Search Relay

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Kata kunci pencarian (misal: Barca, BTC, XAUUSD)"
        required: true
        default: "Barca"

jobs:
  run-x-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache APT Packages & WARP Deb
        id: apt-cache
        uses: actions/cache@v4
        with:
          path: |
            /var/cache/apt/archives
            /tmp/warp_pkg
          key: ${{ runner.os }}-apt-warp-v1

      - name: Cache Camoufox Browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-browser-v1

      - name: Cache Python Virtualenv / Pip
        id: venv-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/lib/python3.11/site-packages
          key: ${{ runner.os }}-pip-site-packages-v1

      - name: Fast Setup Dependencies & WARP
        run: |
          # 1. Cek & Install Cloudflare WARP via cached .deb jika ada, jika tidak unduh sekali
          mkdir -p /tmp/warp_pkg
          if [ ! -f /tmp/warp_pkg/cloudflare-warp.deb ]; then
            echo "Downloading Cloudflare WARP deb package to cache..."
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update -o Dir::Cache::archives="/var/cache/apt/archives"
            sudo apt-get install -d -y cloudflare-warp xvfb
            # Simpan deb ke direktori cache permanen
            cp /var/cache/apt/archives/cloudflare-warp*.deb /tmp/warp_pkg/cloudflare-warp.deb 2>/dev/null || true
          fi

          # Install xvfb & warp dari cache lokal (sangat cepat ~3 detik tanpa download ulang)
          sudo apt-get install -y xvfb
          if [ -f /tmp/warp_pkg/cloudflare-warp.deb ]; then
            sudo dpkg -i /tmp/warp_pkg/cloudflare-warp.deb || sudo apt-get -f install -y
          else
            sudo apt-get install -y cloudflare-warp || true
          fi

          # 2. Inisialisasi Cloudflare WARP Proxy
          if command -v warp-cli >/dev/null 2>&1; then
            echo "Initializing WARP in proxy mode..."
            warp-cli --accept-tos registration new || true
            warp-cli --accept-tos mode proxy || true
            warp-cli --accept-tos proxy port 40000 || true
            warp-cli --accept-tos connect || true
            sleep 2
            warp-cli --accept-tos status || true
          fi

          # 3. Pip dependencies (akan instan jika site-packages sudah di-cache)
          pip install --user "camoufox[geoip]" requests
          camoufox fetch

      - name: Run X Search Engine with Camoufox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSHARE_ROTATING_PROXY: ${{ secrets.WEBSHARE_ROTATING_PROXY }}
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -u x_engine.py "${{ github.event.inputs.query }}"

      - name: Commit Updated Session If Changed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Ciro Session Bot"
          git config user.email "ciro@automated.local"
          if [ -f session_x.json ]; then
            git add session_x.json
            if ! git diff --cached --quiet; then
              git commit -m "Auto-persist session_x.json [skip ci]"
              git push origin main
            else
              echo "No session changes to commit."
            fi
          fi
