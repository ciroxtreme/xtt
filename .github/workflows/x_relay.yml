name: X (Twitter) Live Search Relay

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Kata kunci pencarian (misal: Barca, BTC, XAUUSD)"
        required: true
        default: "Barca"

jobs:
  run-x-relay:
    runs-on: ubuntu-latest
    services:
      warp:
        image: caomingjun/warp
        ports:
          - 40000:1080
        env:
          WARP_SLEEP: 2

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Camoufox Browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-browser-v1

      - name: Cache Pip Wheels
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-cache-v1

      - name: Instant Setup Dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          # 1. Pasang hanya xvfb (sangat cepat ~3 detik, tanpa apt dependency hell WARP)
          sudo apt-get install -y --no-install-recommends xvfb

          # 2. Cek status WARP Proxy Container yang sudah ready di port 40000
          curl -s --socks5 127.0.0.1:40000 https://cloudflare.com/cdn-cgi/trace | grep -E "(warp|ip)" || echo "WARP starting..."

          # 3. Pip dependencies (instan dari cache wheel)
          pip install "camoufox[geoip]" requests

          # 4. Gunakan Camoufox browser dari cache jika ada
          if [ ! -d ~/.cache/camoufox ] || [ -z "$(ls -A ~/.cache/camoufox 2>/dev/null)" ]; then
            echo "Camoufox cache empty, fetching browser..."
            camoufox fetch || true
          else
            echo "Camoufox browser restored from cache!"
          fi

      - name: Run X Search Engine with Camoufox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSHARE_ROTATING_PROXY: ${{ secrets.WEBSHARE_ROTATING_PROXY }}
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -u x_engine.py "${{ github.event.inputs.query }}"

      - name: Commit Updated Session If Changed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Ciro Session Bot"
          git config user.email "ciro@automated.local"
          if [ -f session_x.json ]; then
            git add session_x.json
            if ! git diff --cached --quiet; then
              git commit -m "Auto-persist session_x.json [skip ci]"
              git push origin main
            else
              echo "No session changes to commit."
            fi
          fi
