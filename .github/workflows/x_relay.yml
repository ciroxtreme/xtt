name: X (Twitter) Live Search Relay

on:
  workflow_dispatch:
    inputs:
      query:
        description: "Kata kunci pencarian (misal: Barca, BTC, XAUUSD)"
        required: true
        default: "Barca"

jobs:
  run-x-relay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Camoufox Browser
        id: camoufox-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/camoufox
          key: ${{ runner.os }}-camoufox-browser-v1

      - name: Setup Ultralight WARP & Dependencies
        run: |
          # 1. Pasang tools dasar & xvfb
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends xvfb libpcap0.8 curl gpg lsb-release

          # 2. Ekstrak portable warp binaries dari .deb jika belum ada
          if [ ! -f /usr/local/bin/warp-svc ]; then
            echo "Extracting portable warp binaries..."
            curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
            echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
            sudo apt-get update -y
            mkdir -p /tmp/warp_extract
            cd /tmp/warp_extract
            apt-get download cloudflare-warp
            dpkg-deb -x cloudflare-warp*.deb ./
            sudo cp bin/warp-svc /usr/local/bin/
            sudo cp bin/warp-cli /usr/local/bin/
            sudo chmod +x /usr/local/bin/warp-svc /usr/local/bin/warp-cli
            cd -
            rm -rf /tmp/warp_extract
          fi

          # 3. Jalankan daemon warp-svc dengan direktori runtime Cloudflare resmi
          echo "Starting warp-svc daemon with proper runtime dirs..."
          sudo mkdir -p /var/lib/cloudflare-warp /run/cloudflare-warp
          sudo chmod 777 /var/lib/cloudflare-warp /run/cloudflare-warp
          sudo nohup /usr/local/bin/warp-svc > /tmp/warp_svc.log 2>&1 &
          sleep 4

          # 4. Inisialisasi WARP Proxy di Port 40000 dengan sudo agar socket IPC berizin
          echo "Configuring warp-cli..."
          sudo warp-cli --accept-tos registration new || true
          sudo warp-cli --accept-tos mode proxy || true
          sudo warp-cli --accept-tos proxy port 40000 || true
          sudo warp-cli --accept-tos connect || true
          sleep 3
          sudo warp-cli --accept-tos status || true

          # 5. Pip dependencies & Browser Camoufox
          pip install "camoufox[geoip]" requests
          if [ ! -d ~/.cache/camoufox ] || [ -z "$(ls -A ~/.cache/camoufox 2>/dev/null)" ]; then
            camoufox fetch || true
          fi

      - name: Run X Search Engine with Camoufox
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WEBSHARE_ROTATING_PROXY: ${{ secrets.WEBSHARE_ROTATING_PROXY }}
          PYTHONUNBUFFERED: "1"
        run: |
          xvfb-run -a python -u x_engine.py "${{ github.event.inputs.query }}"

      - name: Commit Updated Session If Changed
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name "Ciro Session Bot"
          git config user.email "ciro@automated.local"
          if [ -f session_x.json ]; then
            git add session_x.json
            if ! git diff --cached --quiet; then
              git commit -m "Auto-persist session_x.json [skip ci]"
              git push origin main
            else
              echo "No session changes to commit."
            fi
          fi
